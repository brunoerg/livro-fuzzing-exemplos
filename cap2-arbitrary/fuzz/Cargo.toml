[package]
name = "conta-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.conta]
path = ".."

[[bin]]
name = "operacoes"
path = "fuzz_targets/operacoes.rs"
test = false
doc = false
bench = false
